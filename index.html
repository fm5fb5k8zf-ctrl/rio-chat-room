<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8edf2">
<title>月城凛央 · 私人对话</title>
<style>
  :root{
    --bg:#f8edf2; --ink:#473943; --muted:#9b8793;
    --rose:#d88eaa; --rose-deep:#b96d8d; --glass:rgba(255,255,255,.76);
    --line:rgba(185,109,141,.18); --shadow:0 12px 35px rgba(116,70,91,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(ellipse at 10% 0%, rgba(255,255,255,.95), transparent 38%),
      radial-gradient(ellipse at 100% 30%, rgba(238,195,212,.45), transparent 35%),
      linear-gradient(145deg,#fbf5f7,#f5e5ed 65%,#f9f1f5);
  }
  .app{max-width:760px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
  header{
    position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px;
    padding:14px 8px 13px; background:rgba(250,241,246,.86); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
  }
  .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:white;font-size:20px;background:linear-gradient(145deg,#e6b4c9,#b87598);box-shadow:0 5px 14px #c98aa84c}
  .heading{min-width:0;flex:1}
  .heading h1{font-size:16px;margin:0 0 4px;font-weight:650;letter-spacing:.04em}
  .status{font-size:12px;color:var(--muted)}
  .status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#83b89a;margin:0 6px 1px 0}
  .pill{font-size:11px;color:var(--rose-deep);border:1px solid var(--line);background:#fff8fb;border-radius:99px;padding:7px 10px;white-space:nowrap}
  .intro{text-align:center;padding:22px 12px 12px;color:var(--muted);font-size:12px;line-height:1.7}
  .intro .ornament{font-size:18px;color:#cf8eaa;letter-spacing:.3em;margin-bottom:4px}
  #messages{flex:1;padding:8px 2px 18px;display:flex;flex-direction:column;gap:17px}
  .row{display:flex;align-items:flex-end;gap:8px;max-width:92%;animation:appear .22s ease-out}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .mini-avatar{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:linear-gradient(145deg,#e4b2c7,#bb7998)}
  .user .mini-avatar{background:linear-gradient(145deg,#cbb9e8,#a395cf)}
  .bubble-wrap{min-width:0}
  .name{font-size:11px;color:var(--muted);margin:0 0 5px 4px}
  .user .name{text-align:right;margin:0 4px 5px 0}
  .bubble{
    position:relative;padding:12px 15px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;
    border:1px solid rgba(255,255,255,.9);box-shadow:0 5px 18px rgba(111,68,88,.07);
  }
  .assistant .bubble{background:var(--glass);border-radius:5px 19px 19px 19px}
  .user .bubble{background:linear-gradient(135deg,#e9dff8,#f1e7fa);border-color:#fff8ff;border-radius:19px 5px 19px 19px}
  .time{font-size:10px;color:#b4a1ac;margin:5px 4px 0}
  .user .time{text-align:right}
  .typing{display:inline-flex;gap:4px;padding:4px 2px;align-items:center}
  .typing i{width:5px;height:5px;background:#c58ba4;border-radius:50%;animation:bounce 1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .composer-wrap{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(248,237,242,.94) 20%);backdrop-filter:blur(12px)}
  .hint{text-align:center;font-size:10px;color:#ae9ba6;margin:0 0 8px}
  .composer{display:flex;gap:9px;align-items:flex-end;padding:8px 8px 8px 15px;background:rgba(255,255,255,.88);border:1px solid rgba(203,143,169,.28);border-radius:24px;box-shadow:var(--shadow)}
  textarea{font:inherit;font-size:15px;line-height:1.45;resize:none;border:0;outline:0;background:transparent;color:var(--ink);flex:1;min-height:28px;max-height:120px;padding:5px 0}
  textarea::placeholder{color:#b9a6b1}
  button{border:0;cursor:pointer;touch-action:manipulation}
  .send{width:39px;height:39px;border-radius:50%;color:#fff;font-size:17px;flex:none;background:linear-gradient(145deg,#e0a5bd,#bd7596);box-shadow:0 4px 10px #c884a54a}
  .send:active{transform:scale(.96)}
  .foot{text-align:center;font-size:10px;color:#b6a3ae;padding-top:8px}
  @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}
  @media(min-width:600px){.app{padding-left:24px;padding-right:24px}header{padding-top:18px}.intro{padding-top:30px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">凛</div>
    <div class="heading">
      <h1>月城凛央</h1>
      <div class="status">在这里，听你说话</div>
    </div>
    <div class="pill">♡ 私人对话</div>
  </header>

  <div class="intro">
    <div class="ornament">✧　♡　✧</div>
    把想说的话写下来吧。<br>这是一个可自定义的聊天界面示例。
  </div>

  <main id="messages" aria-live="polite">
    <div class="row assistant">
      <div class="mini-avatar">凛</div>
      <div class="bubble-wrap">
        <div class="name">月城凛央</div>
        <div class="bubble">姐姐，晚上好。今天有什么想和我分享的事吗？我在听。</div>
        <div class="time">刚刚</div>
      </div>
    </div>
  </main>

  <div class="composer-wrap">
    <p class="hint">按 Enter 发送 · Shift + Enter 换行</p>
    <form class="composer" id="chatForm">
      <textarea id="messageInput" rows="1" placeholder="给凛央发一条消息……" aria-label="输入消息"></textarea>
      <button class="send" type="submit" aria-label="发送">↑</button>
    </form>
    <div class="foot">界面原型 · 当前为本地演示，不会自动连接 AI</div>
  </div>
</div>
<script>
const form = document.getElementById('chatForm');
const input = document.getElementById('messageInput');
const messages = document.getElementById('messages');

function nowTime(){
  return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
}
function addMessage(text, who='user', time=nowTime()){
  const row = document.createElement('div');
  row.className = `row ${who}`;
  const avatar = document.createElement('div');
  avatar.className = 'mini-avatar';
  avatar.textContent = who === 'user' ? '♡' : '凛';
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = who === 'user' ? '你' : '月城凛央';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const stamp = document.createElement('div');
  stamp.className = 'time';
  stamp.textContent = time;
  wrap.append(name,bubble,stamp);
  row.append(avatar,wrap);
  messages.appendChild(row);
  row.scrollIntoView({behavior:'smooth',block:'end'});
  return row;
}
function showTyping(){
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.id = 'typingRow';
  row.innerHTML = '<div class="mini-avatar">凛</div><div class="bubble-wrap"><div class="name">月城凛央</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>';
  messages.appendChild(row);
  row.scrollIntoView({behavior:'smooth',block:'end'});
  return row;
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addMessage(text,'user');
  input.value = '';
  input.style.height = 'auto';
  const typing = showTyping();
  // 本地演示回复。接入真实 AI 时，将这里替换为你的后端 API 调用。
  window.setTimeout(() => {
    typing.remove();
    addMessage('我收到你的消息了。♡\\n\\n现在这个页面是界面演示版，还没有连接 AI 服务。若要实现真正的 AI 多轮对话，需要再接入模型 API。','assistant');
  }, 900);
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight,120) + 'px';
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
